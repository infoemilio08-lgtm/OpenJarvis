# Render Blueprint de "mi-jarvis": servidor OpenJarvis + bot de Telegram,
# usando Gemini (nivel gratuito de Google) como cerebro. Plan gratuito.
# La configuración en español está en deploy/render/home/ y se copia a la
# imagen desde deploy/docker/Dockerfile.
services:
  - type: web
    name: mi-jarvis
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    # El motor y el modelo vienen de deploy/render/home/config.toml.
    dockerCommand: serve --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"

      # Clave de acceso a la API/web de tu JARVIS (Render la genera sola).
      # El servidor se niega a escuchar en 0.0.0.0 sin ella.
      - key: OPENJARVIS_API_KEY
        generateValue: true

      # Tus claves: Render te las pedirá al crear el servicio.
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      # El disco del plan gratuito es temporal: se borra en cada reinicio.
      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis
